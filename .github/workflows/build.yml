# Every night at 02:00 Taiwan time (18:00 UTC): Taiwan's bus routes and
# timetables from TDX, packed (build.mjs) and published on GitHub Pages.
# Needs the repo secrets TDX_CLIENT_ID and TDX_CLIENT_SECRET.
name: Build
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub stops a scheduled workflow after 60 days without a commit: one
      # small one every 45 days keeps this one running.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "transit-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Keep the nightly build scheduled"
            git push
          fi
