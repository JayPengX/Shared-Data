# Every night at midnight Taiwan time (16:00 UTC): every league's season for
# Orbit Sports and Quadra Play (sports.mjs), and on Mondays Taiwan's bus
# routes and timetables from TDX (build.mjs; timetables change rarely, and
# holidays come with their own days in them). The other nights the week's
# bus packs are carried over as published (carry.mjs): a Pages deploy
# replaces the whole site. Run workflow builds it at once (tick "buses" to
# rebuild those too). Then the mirror (mirror.mjs): copies of the reads
# Sports and Play would ask the proxy for, each good until it could change;
# before it, past games' win probability (winprob.mjs), read once and kept
# in this repo for good. The buses need the repo secrets TDX_CLIENT_ID and
# TDX_CLIENT_SECRET.
name: Build
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      buses:
        description: Rebuild the bus packs too
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The shared kit's league catalogue (which leagues, their ESPN paths).
      - uses: actions/checkout@v4
        with:
          repository: JayPengX/Shared-Proxy
          path: shared
          sparse-checkout: |
            kit
            sports-proxy-worker.js
            quadra-token.js
            asia-baseball.js
            f1-live.js
          sparse-checkout-cone-mode: false
      # Orbit Sports' win probability (the matching shared with the app, winprob.mjs).
      - uses: actions/checkout@v4
        with:
          repository: JayPengX/Orbit-Sports
          path: sports-app
          sparse-checkout: |
            public/lib/winprob.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Monday in Taiwan (Sunday 16:00 UTC), or asked for: the buses anew.
      - name: Buses
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.buses }}" = "true" ]; then node build.mjs; else node carry.mjs; fi
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      # Which packs and YouBike cities are near each point (where.mjs), from
      # the week's bus packs and TDX's bike stations.
      - name: Where
        run: node where.mjs
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: Sports
        run: node sports.mjs
        env:
          KIT: shared/kit
      # Past games' win probability, kept for good (winprob.mjs): only the
      # games over since the last night are read, committed here and published.
      - name: Win probability
        run: |
          node winprob.mjs
          if [ -n "$(git status --porcelain winprob)" ]; then
            git config user.name "shared-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add winprob
            git commit -q -m "Win probability: the games over by $(date -u +%F)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          fi
          cp -r winprob site/
        env:
          KIT: shared/kit
          SPORTS_LIB: sports-app/public/lib
      # The mirror: copies of the reads the apps would ask the proxy for (mirror.mjs).
      - name: Mirror
        run: node mirror.mjs
        env:
          KIT: shared/kit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub stops a scheduled workflow after 60 days without a commit: one
      # small one every 45 days keeps this one running.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "shared-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Keep the nightly build scheduled"
            git push
          fi
