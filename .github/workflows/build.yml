# Every night just after midnight Taiwan time (16:23 UTC: GitHub starts
# scheduled runs on the hour hours late, its busiest minute): every league's season for
# Orbit Sports and Quadra Play (sports.mjs), and on Mondays Taiwan's bus
# routes and timetables from TDX (build.mjs; timetables change rarely, and
# holidays come with their own days in them). The other nights the week's
# bus packs are carried over as published (carry.mjs): a Pages deploy
# replaces the whole site. Run workflow (by hand) builds only the part asked
# for (win probability by default) on the site as last built (the last
# build's Pages artifact, kept three days), never the whole night again; tick
# "buses" to rebuild those too. Then the mirror (mirror.mjs): copies of the reads
# Sports and Play would ask the proxy for, each good until it could change;
# before it, past games' win probability (winprob.mjs), read once and
# carried over while Sports can show the game. The buses need the repo secrets TDX_CLIENT_ID and
# TDX_CLIENT_SECRET.
# Between the nights, every three hours or so: only TheSportsDB's cutouts
# (cutouts.mjs) for the footballers the night left, on the site as last built.
name: Build
on:
  schedule:
    - cron: '23 16 * * *'
    - cron: '41 19,22,1,4,7,10,13 * * *'
  workflow_dispatch:
    inputs:
      part:
        description: What to build (the rest as last built)
        type: choice
        options: [winprob, sports, mirror, cutouts, everything]
        default: winprob
      buses:
        description: Rebuild the bus packs too
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # A day run (cutouts only) with nothing left to look up stops here: no
  # rebuild, no redeploy.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.left.outputs.go }}
    steps:
      - id: left
        run: |
          if [ "${{ github.event_name == 'schedule' && github.event.schedule != '23 16 * * *' }}" = "true" ]; then
            n=$(curl -sf https://jaypengx.github.io/Shared-Data/sports/cutouts/pending.json | jq '.names | length' || echo 1)
            echo "cutouts left: $n"
            [ "$n" = "0" ] && echo "go=false" >> "$GITHUB_OUTPUT" || echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # The night's build (or asked for whole): every part; by hand, only the one asked for.
      FULL: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 16 * * *') || inputs.part == 'everything' }}
      PART: ${{ github.event_name == 'schedule' && github.event.schedule != '23 16 * * *' && 'cutouts' || inputs.part }}
    steps:
      - uses: actions/checkout@v4
      # The shared kit's league catalogue (which leagues, their ESPN paths).
      - uses: actions/checkout@v4
        with:
          repository: JayPengX/Shared-Proxy
          path: shared
          sparse-checkout: |
            kit
            sports-proxy-worker.js
            quadra-token.js
            asia-baseball.js
            f1-live.js
          sparse-checkout-cone-mode: false
      # Orbit Sports' win probability (the matching shared with the app,
      # winprob.mjs) and its leagues (broadcast.mjs: what the mirror makes
      # Sports' own reads for).
      - uses: actions/checkout@v4
        with:
          repository: JayPengX/Orbit-Sports
          path: sports-app
          sparse-checkout: |
            public/lib/winprob.mjs
            public/lib/broadcast.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # By hand: the site as last built (the last good build's Pages artifact), the part asked for built on it.
      - name: The site as last built
        if: env.FULL != 'true'
        run: |
          # The newest run with the site in it (a day run that stopped early has none).
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=20" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id')
          gh run download "$id" --name github-pages --dir last
          mkdir -p site && tar -xf last/artifact.tar -C site
          echo "restored $(find site -type f | wc -l) files from run $id"
        env:
          GH_TOKEN: ${{ github.token }}
      # Monday in Taiwan (Sunday from 16:00 UTC), or asked for: the buses anew.
      - name: Buses
        if: env.FULL == 'true' || inputs.buses
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.buses }}" = "true" ]; then node build.mjs; else node carry.mjs; fi
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      # Which packs and YouBike cities are near each point (where.mjs), from
      # the week's bus packs and TDX's bike stations.
      - name: Where
        if: env.FULL == 'true' || inputs.buses
        run: node where.mjs
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: Sports
        if: env.FULL == 'true' || env.PART == 'sports'
        run: node sports.mjs
        env:
          KIT: shared/kit
      # CPBL's table as the league publishes it (cpbl.mjs): ESPN has none.
      - name: CPBL table
        if: env.FULL == 'true' || env.PART == 'sports'
        run: node cpbl.mjs
        env:
          KIT: shared/kit
      # Past games' win probability while Sports can show them (winprob.mjs):
      # carried over from the published site, only the games over since read.
      - name: Win probability
        if: env.FULL == 'true' || env.PART == 'winprob' || env.PART == 'sports'
        run: node winprob.mjs
        env:
          KIT: shared/kit
          SPORTS_LIB: sports-app/public/lib
      # The mirror: copies of the reads the apps would ask the proxy for (mirror.mjs).
      - name: Mirror
        if: env.FULL == 'true' || env.PART == 'mirror'
        run: node mirror.mjs
        env:
          KIT: shared/kit
          SPORTS_LIB: sports-app/public/lib
      # The day's runs: the cutouts the night left (and, by hand, the same).
      - name: Cutouts
        if: env.PART == 'cutouts'
        run: node cutouts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # Kept three days: a build by hand starts from it.
          retention-days: 3
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub stops a scheduled workflow after 60 days without a commit: one
      # small one every 45 days keeps this one running.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "shared-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Keep the nightly build scheduled"
            git push
          fi
